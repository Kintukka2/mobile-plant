# =============================================================================
#  Builds the iOS app on a macOS runner and uploads it to App Store Connect.
#  ---------------------------------------------------------------------------
#  This exists because Xcode Cloud cannot be started from a Windows machine.
#  Its onboarding is Xcode-only: both the account-level and the app-level
#  Xcode Cloud pages in App Store Connect say "Get started in Xcode" and offer
#  no button, so the recommended route in native/ios-setup.md is unreachable
#  without a Mac. This is the fallback, and it is the one in use.
#
#  Manual trigger only, deliberately. This repository is private, so macOS
#  minutes are billed at ten times the normal rate against the account's
#  included allowance — a build on every push would exhaust a month in an
#  afternoon. Run it when there is something to ship.
# =============================================================================
name: iOS build and upload

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (off = build and keep the .ipa only)'
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      WORKSPACE: native/ios/App/App.xcworkspace
      SCHEME: App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Report the toolchain
        run: |
          xcodebuild -version
          pod --version
          node --version
          sw_vers

      # The committed ios/ project is not standalone: Capacitor links it into
      # ../../node_modules and App/App/public is generated and git-ignored. A
      # build without this either fails on a missing Pods directory or — worse
      # — succeeds and ships an empty WebView. Same sequence as ci_post_clone.sh.
      - name: Prepare the Capacitor wrapper
        working-directory: native
        run: |
          npm ci --no-audit --no-fund
          node copy-web.js
          npx cap sync ios

      # Automatic signing needs a distribution certificate whose private key is
      # in the keychain. A runner is ephemeral, so if one is not imported here
      # xcodebuild asks App Store Connect for a brand new certificate on every
      # run and hits the three-certificate account limit within a few builds.
      # Importing the same .p12 each time is what keeps that from happening.
      - name: Import the distribution certificate
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/dist.p12"

          echo "$CERT_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without a timeout the keychain relocks mid-build and codesign fails
          # with a bare "User interaction is not allowed".
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Grants codesign access without a GUI prompt nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          rm -f "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # -allowProvisioningUpdates plus this key is what removes the fourth
      # artefact from the setup: xcodebuild creates and downloads the App Store
      # provisioning profile itself rather than one being generated by hand and
      # stored as a secret that silently expires a year later.
      - name: Write the App Store Connect API key
        env:
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          # altool only looks here, and xcodebuild is pointed at it explicitly.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      # CURRENT_PROJECT_VERSION is overridden rather than committed because App
      # Store Connect rejects a build number it has already seen, and the run
      # number is the only counter here that never repeats. The marketing
      # version stays as whatever project.pbxproj says.
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export the .ipa
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>67UQU5992R</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      # Kept whether or not the upload runs, and kept when the upload fails.
      # An .ipa in hand is the difference between reading a log and being able
      # to retry the upload by other means.
      - name: Keep the .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sprout-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          # Validate first: it catches a bad icon, a missing usage string or a
          # duplicate build number in seconds, rather than after a full upload
          # and twenty minutes of Processing.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
