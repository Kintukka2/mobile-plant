<!DOCTYPE html>
<html lang="en" data-theme="viridium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1410">
<meta name="color-scheme" content="dark light">
<title>Sprout — evergreen</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- The favicon was an emoji in a <text> node, which meant the tab showed
     whatever herb sprig the host OS happens to draw — a different picture on
     every machine, and none of them ours. Drawn instead in the app's own
     monoline hand on the deep field, so the tab, the splash and the icon
     grid all speak the same language. Inline data URI because a zero-build
     app opened from the filesystem cannot rely on a separate request. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230A1410'/><g fill='none' stroke='%233FBE8B' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'><path d='M50 84V40'/><path d='M50 58C36 58 28 49 28 36c14 0 22 9 22 22Z'/><path d='M50 46c14 0 22-9 22-22-14 0-22 9-22 22Z'/></g></svg>">
<!-- Same three paths as the favicon, the manifest icons and UI.icon('mark').
     There used to be four drawings of this idea: two sprigs at different
     proportions, an unrelated leaf and a symmetric sprout, so the tab, the
     home screen and the app interior each showed a different plant. Stroke
     is 5% of the artboard at this size; below 32px it thickens, because a
     hairline does not survive being scaled down any better than small type
     does — the same reasoning the display face takes a heavier weight for. -->
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A1410'/><g fill='none' stroke='%233FBE8B' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'><path d='M50 84V40'/><path d='M50 58C36 58 28 49 28 36c14 0 22 9 22 22Z'/><path d='M50 46c14 0 22-9 22-22-14 0-22 9-22 22Z'/></g></svg>">

<!-- Type. PP Hatton carries the display caps and is self-hosted — see the
     @font-face block in styles.css. Cormorant Garamond holds the
     high-contrast serif range, Jost the UI, Sacramento the rare flourish;
     those three still come from Google.

     Preconnect because the font CSS blocks first paint; the service worker
     caches both the CSS and the woff2 files so later loads work offline.
     The display face needs neither, being served from this origin and
     precached with the shell — which is why the app is now fully itself on
     a first offline load rather than after the font cache has filled. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Sacramento&display=swap">

<link rel="stylesheet" href="css/styles.css">

<!-- Theme, applied before first paint.
     This cannot wait for app.js at the bottom of the document: by then the
     stylesheet has already painted the dark palette, and a user on the
     daylight theme would watch the whole app flash black and then turn
     ivory on every single load. Eleven lines inline is the price of not
     having that. localStorage is read defensively because private-mode
     Safari throws on access rather than returning null. -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('sprout.theme'); } catch (e) { /* private mode throws */ }

  /* No stored choice means this is a first visit, and the honest default is
     the one the device already asked for. Opening a near-black app on a
     phone that is in light mode — at a sunny window, which is where a plant
     app is most often opened — was the app overriding a preference it had
     never been given a reason to override.

     Only consulted when nothing is stored: once the toggle has been used,
     that choice is the user's and outranks the system for good. */
  if (t !== 'conservatory' && t !== 'viridium') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
      ? 'conservatory' : 'viridium';
  }

  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'conservatory' ? '#F7F3EC' : '#0A1410');
  if (t === 'conservatory') document.documentElement.style.background = '#F7F3EC';
})();
</script>
</head>
<body>

<!-- ============ Splash ============
     Covers the app until fonts settle, so the wordmark never flashes in a
     fallback face. app.js lifts it on the first render. -->
<div class="splash" id="splash">
  <div class="splash-inner">
    <!-- One span per letter so the wordmark can be revealed a letter at a
         time. Split here rather than in JS because the splash has to be on
         screen and animating before any script has run — that is the whole
         of its job. aria-label carries the word, since six separate letters
         is not what a screen reader should announce. -->
    <div class="splash-mark" role="img" aria-label="Sprout"><span aria-hidden="true">S</span><span aria-hidden="true">P</span><span aria-hidden="true">R</span><span aria-hidden="true">O</span><span aria-hidden="true">U</span><span aria-hidden="true">T</span></div>
    <div class="splash-script">evergreen</div>
    <div class="splash-rule"><i></i></div>
  </div>
</div>

<!-- Filmic grain. Purely decorative, sits above everything, eats no clicks. -->
<div class="grain" aria-hidden="true"></div>

<div class="app">

  <!-- ============ Sidebar (desktop) ============ -->
  <aside class="sidebar">
    <!-- Mark plus wordmark. "evergreen" has gone to the splash, where the
         product is introducing itself; a flourish that appears on every
         screen for the whole session is no longer a flourish. -->
    <div class="brand">
      <svg class="brand-glyph" viewBox="0 0 100 100" fill="none" stroke="currentColor"
           stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M50 84V40"/>
        <path d="M50 58C36 58 28 49 28 36c14 0 22 9 22 22Z"/>
        <path d="M50 46c14 0 22-9 22-22-14 0-22 9-22 22Z"/>
      </svg>
      <span class="brand-name">SPROUT</span>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="sidebar-foot">
      <div class="weather-chip" id="weather-chip" hidden></div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch theme"></button>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn topbar-back" id="btn-back" hidden aria-label="Back"></button>
      <div class="topbar-titles">
        <h1 class="topbar-title" id="view-title">Today</h1>
        <p class="topbar-sub" id="view-sub"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <div class="view" id="view" role="region" aria-live="polite"></div>
  </main>

  <!-- ============ Bottom nav (mobile) ============ -->
  <nav class="tabbar" id="tabbar"></nav>

</div>

<!-- ============ Overlays ============ -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <!-- Outside the scrolling body on purpose, so a form's primary action is
         pinned to the plate instead of having to be scrolled into view.
         openSheet() relocates a trailing row of buttons in here, and the
         footer collapses to nothing for sheets that have no actions. -->
    <div class="sheet-foot" id="sheet-foot"></div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<!-- ============ Scripts (classic, no bundler) ============ -->
<script src="js/data/lookups.js"></script>
<script src="js/data/plants.js"></script>
<script src="js/data/problems.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/photos.js"></script>
<script src="js/schedule.js"></script>
<script src="js/weather.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/greenhouse.js"></script>
<script src="js/views/room.js"></script>
<script src="js/views/plant.js"></script>
<script src="js/views/discover.js"></script>
<script src="js/views/diagnose.js"></script>
<script src="js/views/profile.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/diary.js"></script>
<script src="js/app.js"></script>
</body>
</html>
