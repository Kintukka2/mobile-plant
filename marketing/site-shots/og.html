<!doctype html>

<html><head><meta charset="utf-8">
<style>
@font-face{ font-family:'PP Hatton'; src:url('/site/fonts/hatton-ultralight.woff2') format('woff2'); font-weight:200; }

*{ box-sizing:border-box; margin:0; }
html,body{ width:1200px; height:630px; overflow:hidden; }
body{ background:

.phone img{ display:block; width:100%; border-radius:32px; border:8px solid #040907;
