<!doctype html>
<meta charset="utf-8">
<title>Sprout store frame</title>
<!-- One store screenshot, chosen by the query string:
       frame.html?set=a&n=1&w=1080&h=1920
     Served from the repo root by .claude/serve.js so the faces load from
     css/fonts/, the same files the app ships. Every length is a multiple of
     --u (the canvas width over 1080), so the App Store's 1320x2868 is the
     same layout at its own resolution, not an upscale of the Play one. -->
<style>
@font-face{font-family:'PP Hatton';src:url('/css/fonts/hatton-ultralight.woff2') format('woff2');font-weight:200;font-display:block}
@font-face{font-family:'PP Hatton';src:url('/css/fonts/hatton-medium.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Jost';src:url('/css/fonts/jost-var.woff2') format('woff2');font-weight:300 500;font-display:block}
@font-face{font-family:'Cormorant';src:url('/css/fonts/cormorant-var.woff2') format('woff2');font-weight:300 700;font-display:block}
:root{ --bg:#050A08; --ink:#F3F6F1; --ink2:rgba(228,240,232,.74); --glow:#3FBE8B; --mint:#9FD3BE;
       --leaf:#2F9A70; --sun:#E0C47A; --terra:#D08A62; --hair:rgba(214,237,226,.14); --u:1px; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);overflow:hidden}
#v{position:relative;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0;pointer-events:none}
/* The reels' ground: a green bloom from above, a 60px hairline grid that
   fades out away from it, and a vignette. Dots would have been Spot Me's. */
.bloom{background:radial-gradient(calc(var(--u)*1100) calc(var(--u)*900) at 50% -8%,rgba(47,154,112,.30),transparent 70%)}
.grid{background-image:linear-gradient(to right,rgba(214,237,226,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(214,237,226,.045) 1px,transparent 1px);
      background-size:calc(var(--u)*60) calc(var(--u)*60);
      -webkit-mask-image:radial-gradient(calc(var(--u)*900) calc(var(--u)*1100) at 50% 22%,#000 0%,rgba(0,0,0,.4) 55%,transparent 85%)}
.vig{background:radial-gradient(150% 120% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}

.copy{position:absolute;left:calc(var(--u)*80);right:calc(var(--u)*80);top:calc(var(--u)*120);text-align:center}
.eyebrow{font-family:'Jost';font-weight:500;font-size:calc(var(--u)*26);letter-spacing:.3em;text-transform:uppercase;color:var(--glow);margin-right:-.3em}
/* Hatton at 200: the brand puts the ultralight on everything 28px and
   over, and a store headline is the largest type Sprout sets. */
h1{font-family:'PP Hatton';font-weight:200;font-size:calc(var(--u)*92);line-height:1.08;color:var(--ink);letter-spacing:.002em;margin-top:calc(var(--u)*30);text-wrap:balance}
h1 em{font-style:normal;color:var(--glow)}
.sub{font-family:'Cormorant';font-weight:500;font-size:calc(var(--u)*40);line-height:1.3;color:var(--ink2);margin-top:calc(var(--u)*26);text-wrap:balance}

/* The phone, drawn rather than photographed, as on the site: a near-black
   bezel, a hairline, and a long shadow. */
.phone{position:absolute;border-radius:calc(var(--u)*70);background:#040907;padding:calc(var(--u)*14);
       box-shadow:0 0 0 calc(var(--u)*1.5) var(--hair),0 calc(var(--u)*60) calc(var(--u)*140) rgba(0,0,0,.7)}
.phone img.scr{display:block;width:100%;border-radius:calc(var(--u)*56)}
.halo{position:absolute;border-radius:50%;filter:blur(calc(var(--u)*90));opacity:.5}
.halo.leaf{background:var(--leaf)} .halo.sun{background:var(--sun);opacity:.34} .halo.terra{background:var(--terra);opacity:.36}

/* A card lifted off the screen: the same pixels, larger, on its own
   ground, ringed in the glow so the eye lands on it first. */
.pop{position:absolute;border-radius:calc(var(--u)*22);overflow:hidden;background:#0E1B15;
     box-shadow:0 0 0 calc(var(--u)*3) var(--glow),0 0 calc(var(--u)*60) rgba(63,190,139,.35),0 calc(var(--u)*40) calc(var(--u)*80) rgba(0,0,0,.7)}
.pop img{display:block;width:100%}
.pop.pad{padding:calc(var(--u)*24) calc(var(--u)*28)}

.sprout{position:absolute;bottom:0;pointer-events:none;
        -webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent)}
.sprout.r{right:0;transform:scaleX(-1)} .sprout.l{left:0}

/* Tablet: Play's 7- and 10-inch slots are landscape, so the words take a
   left column and the wide layout sits on the right in a drawn tablet. */
.tab .copy{left:calc(var(--u)*120);right:auto;width:calc(var(--u)*660);top:calc(var(--u)*190);text-align:left}
.tab .eyebrow{margin-right:0}
.tab h1{font-size:calc(var(--u)*84)}
/* A 4:3 canvas (the App Store's iPad slot) has a third more height than
   Play's 16:9, which left the tablet small with empty ground under it. The
   words take the full width across the top instead, and the tablet grows
   into the space below. */
.tab.tall .copy{width:calc(var(--u)*1680);top:calc(var(--u)*130)}
.tilt .copy{text-align:left;right:calc(var(--u)*120)}
.tilt .eyebrow{margin-right:0}
</style>
<div id="v">
  <div class="layer bloom"></div><div class="layer grid"></div><div class="layer vig"></div>
</div>
<script src="sets.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  // A tablet canvas is laid out on a 1920-wide reference, a phone on 1080.
  const TAB = q.get('device') === 'tablet';
  const W = +q.get('w') || 1080, H = +q.get('h') || 1920, U = W / (TAB ? 1920 : 1080), HU = H / U;
  const f = SETS[q.get('set') || 'a'].frames[(+q.get('n') || 1) - 1];
  const v = document.getElementById('v');
  document.documentElement.style.setProperty('--u', U + 'px');
  v.style.width = W + 'px'; v.style.height = H + 'px';
  const TALL = TAB && HU > 1200;
  if (TAB) v.classList.add('tab');
  if (TALL) v.classList.add('tall');
  else if (f.layout === 'tilt') v.classList.add('tilt');
  const px = n => (n * U) + 'px';
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const head = esc(f.head).replace(/\*([^*]+)\*/g, '<em>$1</em>');

  const copy = document.createElement('div');
  copy.className = 'copy';
  copy.innerHTML = '<p class="eyebrow">' + esc(f.eyebrow) + '</p><h1>' + head + '</h1>' +
    (f.sub ? '<p class="sub">' + esc(f.sub) + '</p>' : '');
  v.appendChild(copy);

  const SCR = 390 / 844, BEZ = 14;
  function placeTablet() {
    // The wide layout at 1280x800, so 16:10, in a near-black bezel that runs
    // just off the right edge, centred top to bottom.
    const BZ = 18, pw = TALL ? 1500 : 1060, ph = (pw - 2 * BZ) * 0.625 + 2 * BZ;
    const x0 = 1920 - pw + 30, y0 = TALL ? HU - ph - 110 : (HU - ph) / 2;
    const halo = document.createElement('div');
    halo.className = 'halo ' + f.glow;
    Object.assign(halo.style, { left: px(x0 - 60), top: px(y0 + 60), width: px(pw + 120), height: px(ph - 120) });
    const tab = document.createElement('div');
    tab.className = 'phone';
    tab.innerHTML = '<img class="scr" src="raw/tablet/' + f.screen + '.png">';
    Object.assign(tab.style, { left: px(x0), top: px(y0), width: px(pw), padding: px(BZ), borderRadius: px(46) });
    tab.firstChild.style.borderRadius = px(30);
    v.appendChild(halo); v.appendChild(tab);
    if (f.sprout) {
      // Its cut edges are the left and the foot, so as drawn it sits in the
      // bottom-left corner, under the words.
      const sp = document.createElement('img');
      sp.src = '/site/img/sprout-corner.webp';
      sp.className = 'sprout l';
      sp.style.height = px(340);
      v.appendChild(sp);
    }
  }
  function place() {
    if (TAB) return placeTablet();
    const top = (copy.offsetTop + copy.offsetHeight) / U;
    const halo = document.createElement('div');
    const phone = document.createElement('div');
    phone.className = 'phone';
    phone.innerHTML = '<img class="scr" src="raw/' + f.screen + '.png">';
    let pw, px0, py0, rot = 0;
    if (f.layout === 'tilt') {
      // Leaning in: big enough to run off the foot on Play's canvas, and
      // on the App Store's taller one grown, then centred, rather than
      // leaving the bottom third of the canvas empty.
      const room = HU - top - 90;
      pw = Math.max(700, Math.min(820, (room + 60 - 2 * BEZ) * SCR + 2 * BEZ));
      const ph1 = (pw - 2 * BEZ) / SCR + 2 * BEZ;
      px0 = 1080 - pw + 40; py0 = top + 90 + Math.max(0, (room - ph1) / 2); rot = -6;
    } else {
      // Upright: run off the foot by default, which keeps the screen large;
      // `fit` shrinks it until the whole phone shows, for screens whose
      // point is at the bottom.
      const room = HU - top - 70;
      pw = 760;
      const ph = (pw - 2 * BEZ) / SCR + 2 * BEZ;
      if (f.fit && ph > room - 50) pw = (room - 50 - 2 * BEZ) * SCR + 2 * BEZ;
      const ph2 = (pw - 2 * BEZ) / SCR + 2 * BEZ;
      px0 = (1080 - pw) / 2;
      // A taller canvas (the App Store's) centres the phone in what is
      // left rather than leaving a gap under it.
      py0 = top + 70 + Math.max(0, (room - ph2) / 2);
      if (f.sprout) px0 -= 70;
    }
    const ph = (pw - 2 * BEZ) / SCR + 2 * BEZ;
    Object.assign(phone.style, { left: px(px0), top: px(py0), width: px(pw), transform: 'rotate(' + rot + 'deg)', transformOrigin: '50% 0' });
    halo.className = 'halo ' + f.glow;
    Object.assign(halo.style, { left: px(px0 - 40), top: px(py0 + 120), width: px(pw + 80), height: px(Math.min(ph, 1100)) });
    v.appendChild(halo); v.appendChild(phone);

    if (f.pop) {
      const pop = document.createElement('div');
      // The chip rows have no card of their own, so they get one.
      const bare = f.pop === 'plant-chips' || f.pop === 'diagnose-cause';
      pop.className = 'pop' + (bare ? ' pad' : '');
      pop.innerHTML = '<img src="raw/' + f.pop + '.png">';
      const POPS = { 'today-task': [40, 0.40, 760, -3], 'plant-chips': [50, 0.58, 700, -3], 'diagnose-cause': [50, 0.42, 640, -3] };
      const p = POPS[f.pop];
      Object.assign(pop.style, { left: px(p[0]), top: px(py0 + ph * p[1]), width: px(p[2]), transform: 'rotate(' + p[3] + 'deg)' });
      v.appendChild(pop);
    }
    if (f.sprout) {
      const s = document.createElement('img');
      s.src = '/site/img/sprout-corner.webp';
      // Anchored where its two cut edges meet the canvas edges, as on the
      // site: mirrored into the bottom right beside an upright phone, and
      // as drawn in the bottom left when the phone leans in from the right.
      s.className = 'sprout ' + (f.layout === 'tilt' ? 'l' : 'r');
      s.style.height = px(f.layout === 'tilt' ? 500 : 430);
      v.appendChild(s);
    }
  }
  document.fonts.ready.then(() => {
    place();
    const imgs = [...document.images];
    Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => { document.body.dataset.ready = '1'; });
  });
})();
</script>
