ext {
    minSdkVersion = 23
    /* Play refuses a new app below 36: "must target at least API level 36".
       The Capacitor 7 template pins 35 and the first closed-testing upload
       was rejected at Preview and confirm, after the bundle had built and
       uploaded — the error is raised by Play, not by Gradle, so nothing
       local catches it.

       36 is Android 16, where edge-to-edge is enforced and the opt-out
       flag is ignored. The app already draws its own safe areas through
       env(safe-area-inset-*) on .topbar and .tabbar, so this should be a
       no-op — but it is the thing to look at first if the layout moves. */
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}