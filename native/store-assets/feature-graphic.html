<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprout — Play feature graphic</title>
<!--
  The source of play-feature-graphic-1024x500.png. It is rendered with the
  store screenshots, from the same capture of the plant page, so the phone
  here is the app as it is now:

    node .claude/serve.js &
    NODE_PATH=$(npm root -g) node marketing/store-shots/capture.js plant
    NODE_PATH=$(npm root -g) node marketing/store-shots/render.js

  It used to be the lockup alone, centred. The listing's screenshots now
  carry a headline over a real screen, so the graphic says the same thing
  in the same voice: the lockup and one line on the left, the phone on the
  right. The lockup stays well inside the left edge, because Play crops
  this on some surfaces.

  Over http rather than file://, because the faces are loaded by relative
  path and a file:// origin blocks them silently — the graphic renders in
  Times and nothing says so.

  It is a page rather than a drawing because the lockup is type, and both
  faces are the app's own. Redrawing the wordmark by hand in an image editor
  is how a wordmark drifts from the product.

  The geometry is the one on sproutevergreen.com, derived from a single
  --wm and reproduced here rather than reinvented, so the graphic Play
  shows and the page the CTA leads to are the same lockup. The first pass
  differed in three ways and each was wrong:

    - the mark was centred on the whole two-line block, so it floated
      between the lines instead of sitting beside SPROUT;
    - its viewBox was 22 4 56 100, which is not the mark's extent. The
      paths span y 24..84 but the 5-unit stroke is centred on them, so the
      ink reaches 21.5..86.5 — 24 20 52 68 is the box that holds it and
      nothing else;
    - a text-indent cancelled the trailing tracking gap. That correction is
      for a *centred* wordmark; left-aligned there is nothing to cancel and
      it pushed SPROUT out of line with the script beneath.
-->
<style>
  /* Self-hosted, like everything else. This used to pull Sacramento from
     Google Fonts, which meant the graphic could not be regenerated offline
     and would fall back to a system cursive without erroring. */
  @font-face {
    font-family: 'PP Hatton';
    src: url('../../css/fonts/hatton-ultralight.woff2') format('woff2');
    font-weight: 200;
    font-display: block;
  }
  @font-face {
    font-family: 'Jost';
    src: url('../../css/fonts/jost-var.woff2') format('woff2');
    font-weight: 300 500;
    font-display: block;
  }
  @font-face {
    font-family: 'Sacramento';
    src: url('../../css/fonts/sacramento-400.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { position: relative; background: #050A08; }
  /* The listing's ground: a bloom behind the phone, the hairline grid
     fading out from it, a vignette at the edges. */
  .bloom { position: absolute; inset: 0;
    background: radial-gradient(520px 420px at 78% 60%, rgba(47,154,112,.32), transparent 70%),
                radial-gradient(700px 500px at 20% -10%, rgba(47,154,112,.14), transparent 70%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgba(214,237,226,.045) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(214,237,226,.045) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(520px 420px at 70% 45%, #000, transparent 85%); }

  .left { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 520px; }
  .lockup {
    --wm: 50px;
    --mk: calc(var(--wm) * 0.96);
    /* 52/68, the cropped viewBox's own aspect. Declared once so the mark's
       width and the script's indent cannot disagree. */
    --mkw: calc(var(--mk) * 0.7647);
    --gap: calc(var(--wm) * 0.26);
  }
  /* Hatton at 200, as the brand sets everything 28px and over. */
  h1 { font-family: 'PP Hatton', serif; font-weight: 200; font-size: 50px; line-height: 1.1;
       color: #F3F6F1; margin-top: 34px; }
  h1 em { font-style: normal; color: #3FBE8B; }
  .store { font-family: 'Jost', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: .24em;
           text-transform: uppercase; color: #9FD3BE; margin-top: 26px; }

  .phone { position: absolute; left: 676px; top: 58px; width: 300px; padding: 7px; border-radius: 34px;
           background: #040907; transform: rotate(-6deg); transform-origin: 50% 0;
           box-shadow: 0 0 0 1px rgba(214,237,226,.14), 0 40px 90px rgba(0,0,0,.7); }
  .phone img { display: block; width: 100%; border-radius: 27px; }
  /* The mark shares a row with the wordmark alone, which is what puts it
     beside SPROUT rather than between the two lines. */
  .wm-row { display: flex; align-items: center; gap: var(--gap); }
  .m { width: var(--mkw); height: var(--mk); color: #3FBE8B; flex: none; }
  .m svg { width: 100%; height: 100%; display: block; }
  .word {
    font-family: 'PP Hatton', Didot, 'Times New Roman', serif;
    font-weight: 200;
    font-size: var(--wm);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    line-height: 1;
    color: #F3F6F1;
  }
  .script {
    font-family: 'Sacramento', cursive;
    font-size: calc(var(--wm) * 0.56);
    color: #9FD3BE;
    line-height: 1;
    margin-top: calc(var(--wm) * 0.12);
    /* Hangs under SPROUT, not under the mark. */
    padding-left: calc(var(--mkw) + var(--gap));
  }
</style>
</head>
<body>
  <div class="bloom"></div><div class="grid"></div>
  <div class="phone"><img src="../../marketing/store-shots/raw/plant.png" alt=""></div>
  <div class="left">
  <div class="lockup">
    <div class="wm-row">
      <span class="m">
        <svg viewBox="24 20 52 68" fill="none" stroke="currentColor" stroke-width="5"
             stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sprout">
          <path d="M50 84V40"/>
          <path d="M50 58C36 58 28 49 28 36c14 0 22 9 22 22Z"/>
          <path d="M50 46c14 0 22-9 22-22-14 0-22 9-22 22Z"/>
        </svg>
      </span>
      <div class="word">Sprout</div>
    </div>
    <div class="script">evergreen</div>
  </div>
  <h1>Houseplant care, <em>worked out for your home.</em></h1>
  <p class="store">Free on Google Play</p>
  </div>
  <script>
    // render.js waits for this, so the type and the screen are both in.
    document.fonts.ready.then(function () {
      var i = document.querySelector('.phone img');
      (i.complete ? Promise.resolve() : new Promise(function (r) { i.onload = i.onerror = r; }))
        .then(function () { document.body.dataset.ready = '1'; });
    });
  </script>
</body>
</html>
