<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprout — Play feature graphic</title>
<!--
  The source of play-feature-graphic-1024x500.png. Open it and screenshot the
  page at exactly 1024x500 to regenerate:

    chromium --headless --window-size=1024,500 --force-device-scale-factor=1 \
      --screenshot=play-feature-graphic-1024x500.png feature-graphic.html

  It is a page rather than a drawing because the lockup is type, and the two
  faces are the app's own: Hatton is loaded straight out of css/fonts, and
  Sacramento from the same Google Fonts the app uses. Redrawing the wordmark
  by hand in an image editor is how a wordmark drifts from the product.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
<style>
  @font-face {
    font-family: 'PP Hatton';
    src: url('../../css/fonts/hatton-ultralight.woff2') format('woff2');
    font-weight: 200;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #0A1410;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Play crops this graphic on some surfaces, so the lockup stays centred
     and well inside the edges rather than filling the canvas. */
  .lock { display: flex; align-items: center; gap: 10px; }
  .mark { width: 118px; height: 210px; flex: none; }
  .mark svg { width: 100%; height: 100%; display: block; }
  .words { display: flex; flex-direction: column; align-items: flex-start; }
  /* text-indent replaces the gap the tracking leaves after the last letter,
     so the word is optically centred on its own box. Same correction the
     splash makes. */
  .wordmark {
    font-family: 'PP Hatton', serif;
    font-weight: 200;
    font-size: 104px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    text-transform: uppercase;
    color: #F3F6F1;
    line-height: 1;
  }
  .script {
    font-family: 'Sacramento', cursive;
    font-size: 58px;
    color: #9FD3BE;
    margin-top: 10px;
    padding-left: 6px;
    /* Descenders sit below the line box in this face. */
    padding-bottom: 0.12em;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="lock">
    <!-- The viewBox is cropped to the mark's own extent (x 28..72, y 24..84)
         rather than the full 100 square, so the gap to the wordmark is the
         gap set above and not a box full of empty space. -->
    <div class="mark">
      <svg viewBox="22 4 56 100" fill="none" stroke="#3FBE8B" stroke-width="5"
           stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sprout">
        <path d="M50 84V40"/>
        <path d="M50 58C36 58 28 49 28 36c14 0 22 9 22 22Z"/>
        <path d="M50 46c14 0 22-9 22-22-14 0-22 9-22 22Z"/>
      </svg>
    </div>
    <div class="words">
      <div class="wordmark">Sprout</div>
      <div class="script">evergreen</div>
    </div>
  </div>
</body>
</html>
